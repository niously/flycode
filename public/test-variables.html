<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS 变量测试</title>
  
  <script>
    (function() {
      const STORAGE_KEY = 'flycode-theme-choice';
      function getSystemTheme() {
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      const saved = localStorage.getItem(STORAGE_KEY);
      const choice = (saved === 'light' || saved === 'dark' || saved === 'auto') ? saved : 'auto';
      const actualTheme = (choice === 'auto') ? getSystemTheme() : choice;
      document.documentElement.setAttribute('data-theme', actualTheme);
      document.documentElement.style.colorScheme = actualTheme;
      localStorage.setItem(STORAGE_KEY, choice);
    })();
  </script>
  
  <link rel="stylesheet" href="/styles.css?v=20260902-01">
  
  <style>
    body {
      padding: 20px;
      font-family: monospace;
      line-height: 1.8;
    }
    .test-box {
      padding: 30px;
      margin: 20px 0;
      border: 2px solid var(--border-medium);
      border-radius: 16px;
      background: var(--glass-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .var-display {
      background: var(--input-bg);
      padding: 8px 12px;
      border-radius: 6px;
      margin: 8px 0;
      border: 1px solid var(--border-subtle);
    }
    button {
      padding: 12px 24px;
      background: var(--brand-primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>CSS 变量诊断</h1>
  
  <button id="toggle">🔄 切换主题</button>
  
  <div class="test-box">
    <h2>当前主题信息</h2>
    <div id="theme-info"></div>
  </div>
  
  <div class="test-box">
    <h2>关键 CSS 变量值</h2>
    <div id="vars-info"></div>
  </div>
  
  <div class="test-box">
    <h2>这是一个使用 var(--glass-surface) 的卡片</h2>
    <p>如果主题切换正常，这个卡片的背景色应该明显变化。</p>
  </div>

  <script>
    const STORAGE_KEY = 'flycode-theme-choice';
    
    function getSystemTheme() {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    
    function updateDisplay() {
      const html = document.documentElement;
      const dataTheme = html.getAttribute('data-theme');
      const computedStyle = getComputedStyle(html);
      
      const themeInfo = document.getElementById('theme-info');
      themeInfo.innerHTML = `
        <div class="var-display"><strong>data-theme:</strong> ${dataTheme}</div>
        <div class="var-display"><strong>localStorage:</strong> ${localStorage.getItem(STORAGE_KEY)}</div>
        <div class="var-display"><strong>系统偏好:</strong> ${getSystemTheme()}</div>
      `;
      
      const vars = [
        '--bg-base',
        '--glass-surface',
        '--glass-surface-hover',
        '--ink-900',
        '--border-subtle',
        '--brand-primary'
      ];
      
      const varsInfo = document.getElementById('vars-info');
      varsInfo.innerHTML = vars.map(v => {
        const value = computedStyle.getPropertyValue(v).trim();
        return `<div class="var-display"><strong>${v}:</strong> ${value}</div>`;
      }).join('');
    }
    
    document.getElementById('toggle').addEventListener('click', function() {
      const saved = localStorage.getItem(STORAGE_KEY);
      const current = (saved === 'light' || saved === 'dark' || saved === 'auto') ? saved : 'auto';
      const actualTheme = (current === 'auto') ? getSystemTheme() : current;
      
      const newTheme = (actualTheme === 'dark') ? 'light' : 'dark';
      
      localStorage.setItem(STORAGE_KEY, newTheme);
      document.documentElement.setAttribute('data-theme', newTheme);
      document.documentElement.style.colorScheme = newTheme;
      
      // 强制重绘
      document.body.style.display = 'none';
      document.body.offsetHeight;
      document.body.style.display = '';
      
      setTimeout(updateDisplay, 100);
    });
    
    updateDisplay();
  </script>
</body>
</html>
