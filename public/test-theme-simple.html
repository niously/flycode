<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>主题测试</title>
  <style>
    :root {
      /* 浅色默认 */
      --bg: #f8fafc;
      --text: #090d16;
    }
    
    html[data-theme="light"] {
      --bg: #f8fafc;
      --text: #090d16;
    }
    
    html[data-theme="dark"] {
      --bg: #06070d;
      --text: #ffffff;
    }
    
    body {
      margin: 0;
      padding: 40px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      transition: all 0.3s ease;
      min-height: 100vh;
    }
    
    button {
      padding: 20px 40px;
      font-size: 18px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    
    .info {
      margin-top: 30px;
      padding: 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>主题切换测试</h1>
  <p>如果背景和文字颜色都能切换，说明CSS变量系统正常。</p>
  
  <button onclick="toggle()">🔄 切换主题</button>
  
  <div class="info">
    <div>当前 data-theme: <strong id="theme">-</strong></div>
    <div>CSS --bg 值: <strong id="css-bg">-</strong></div>
    <div>CSS --text 值: <strong id="css-text">-</strong></div>
    <div>body 实际背景: <strong id="body-bg">-</strong></div>
    <div>body 实际文字: <strong id="body-color">-</strong></div>
  </div>
  
  <script>
    function updateInfo() {
      const html = document.documentElement;
      const theme = html.getAttribute('data-theme');
      const styles = getComputedStyle(html);
      const bodyStyles = getComputedStyle(document.body);
      
      document.getElementById('theme').textContent = theme;
      document.getElementById('css-bg').textContent = styles.getPropertyValue('--bg');
      document.getElementById('css-text').textContent = styles.getPropertyValue('--text');
      document.getElementById('body-bg').textContent = bodyStyles.backgroundColor;
      document.getElementById('body-color').textContent = bodyStyles.color;
    }
    
    function toggle() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      html.style.colorScheme = next;
      
      console.log('切换:', current, '→', next);
      setTimeout(updateInfo, 100);
    }
    
    updateInfo();
  </script>
</body>
</html>
